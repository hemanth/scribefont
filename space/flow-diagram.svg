<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 260" width="100%" height="auto" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="980" height="260" fill="#ffffff"/>

  <!-- Stage 1: Handwriting & Biometric Input -->
  <rect x="20" y="36" width="210" height="188" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="34" y="50" width="92" height="20" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="80" y="64" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#000000">[ 1. INPUT ]</text>
  <text x="34" y="94" font-size="14" font-weight="700" fill="#000000">Strokes &amp; Reference</text>
  <text x="34" y="116" font-family="'Geist Mono', monospace" font-size="11" fill="#222222">• 4x 16x16 crop patches</text>
  <text x="34" y="136" font-family="'Geist Mono', monospace" font-size="11" fill="#222222">• Canvas stroke polylines</text>
  <text x="34" y="156" font-family="'Geist Mono', monospace" font-size="11" fill="#222222">• slant | stroke_width</text>
  <text x="34" y="176" font-family="'Geist Mono', monospace" font-size="11" fill="#222222">• x_height | roundness</text>
  <text x="34" y="198" font-family="'Geist Mono', monospace" font-size="10" fill="#555555">62-char multi-stroke prior</text>

  <!-- Arrow 1 -> 2 -->
  <line x1="230" y1="130" x2="268" y2="130" stroke="#000000" stroke-width="1.2"/>
  <polygon points="268,126 276,130 268,134" fill="#000000"/>

  <!-- Stage 2: 3-Tier Synthesis Core (Focal Inverted Black Card) -->
  <rect x="276" y="36" width="224" height="188" rx="6" fill="#000000" stroke="#000000" stroke-width="1.2"/>
  <rect x="290" y="50" width="124" height="20" rx="2" fill="#000000" stroke="#ffffff" stroke-width="1.2"/>
  <text x="352" y="64" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#ffffff">[ 2. 3-TIER CORE ]</text>
  <text x="290" y="94" font-size="14" font-weight="700" fill="#ffffff">ScribeFontForGeneration</text>
  <text x="290" y="116" font-family="'Geist Mono', monospace" font-size="11" fill="#e5e5e5">• Tier 1A: PyTorch 2.94M</text>
  <text x="290" y="136" font-family="'Geist Mono', monospace" font-size="11" fill="#e5e5e5">• Tier 1B: ONNX Int8 3.1MB</text>
  <text x="290" y="156" font-family="'Geist Mono', monospace" font-size="11" fill="#e5e5e5">• Tier 2: Zero-Dep JS/Py</text>
  <text x="290" y="176" font-family="'Geist Mono', monospace" font-size="11" fill="#e5e5e5">• 128-d Calligrapher Latent</text>
  <text x="290" y="198" font-family="'Geist Mono', monospace" font-size="10" fill="#bbbbbb">gnumanth/scribefont</text>

  <!-- Arrow 2 -> 3 -->
  <line x1="500" y1="130" x2="538" y2="130" stroke="#000000" stroke-width="1.2"/>
  <polygon points="538,126 546,130 538,134" fill="#000000"/>

  <!-- Stage 3: 4 Joint Projection Heads -->
  <rect x="546" y="36" width="206" height="188" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="560" y="50" width="112" height="20" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="616" y="64" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#000000">[ 3. FOUR HEADS ]</text>
  <text x="560" y="94" font-size="14" font-weight="700" fill="#000000">Bézier &amp; Metrics</text>
  <text x="560" y="116" font-family="'Geist Mono', monospace" font-size="11" fill="#222222">1. contour_head (16-pt M/Q)</text>
  <text x="560" y="136" font-family="'Geist Mono', monospace" font-size="11" fill="#222222">2. metrics_head (adv, lsb)</text>
  <text x="560" y="156" font-family="'Geist Mono', monospace" font-size="11" fill="#222222">3. missing_head (p_missing)</text>
  <text x="560" y="176" font-family="'Geist Mono', monospace" font-size="11" fill="#222222">4. writer_head  (12 styles)</text>
  <text x="560" y="198" font-family="'Geist Mono', monospace" font-size="10" fill="#555555">invariant: adv &gt;= w + lsb</text>

  <!-- Arrow 3 -> 4 -->
  <line x1="752" y1="130" x2="788" y2="130" stroke="#000000" stroke-width="1.2"/>
  <polygon points="788,126 796,130 788,134" fill="#000000"/>

  <!-- Stage 4: Binary OpenType (.ttf) & SVG Compiler -->
  <rect x="796" y="36" width="164" height="188" rx="6" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <rect x="810" y="50" width="98" height="20" rx="2" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
  <text x="859" y="64" font-family="'Geist Mono', monospace" font-size="10" font-weight="700" text-anchor="middle" fill="#000000">[ 4. OPENTYPE ]</text>
  <text x="810" y="94" font-size="14" font-weight="700" fill="#000000">Verified Font</text>
  <text x="810" y="116" font-family="'Geist Mono', monospace" font-size="11" fill="#222222">• Binary .ttf (7.3 KB)</text>
  <text x="810" y="136" font-family="'Geist Mono', monospace" font-size="11" fill="#222222">• 9 SFNT tables</text>
  <text x="810" y="156" font-family="'Geist Mono', monospace" font-size="11" fill="#222222">• 0xB1B0AFBA sum</text>
  <text x="810" y="176" font-family="'Geist Mono', monospace" font-size="11" fill="#222222">• Optical kerning</text>
  <text x="810" y="196" font-family="'Geist Mono', monospace" font-size="11" fill="#222222">• Vector SVG paths</text>
</svg>
