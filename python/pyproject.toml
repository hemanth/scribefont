[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "scribefont"
version = "0.1.0"
description = "Single-pass handwriting-to-font synthesis, calligrapher style extraction, Bézier glyph vectorization, and zero-dependency binary TrueType (.ttf) compilation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Hemanth HM", email = "hemanth@h3manth.com" }
]
keywords = ["handwriting", "font", "truetype", "opentype", "ttf", "bezier", "onnx", "pytorch"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics :: Editors :: Vector-Based",
  "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
dependencies = []

[project.optional-dependencies]
neural = ["torch>=2.0.0", "transformers>=4.40.0", "onnxruntime>=1.18.0"]

[project.urls]
Homepage = "https://hemanth.github.io/scribefont/"
Repository = "https://github.com/hemanth/scribefont"
